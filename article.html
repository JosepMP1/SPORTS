<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07141d">
  <meta name="description" content="Análisis y actualidad deportiva en SPORTS.">
  <title>Artículo | SPORTS</title>
  <style>
    :root {
      color-scheme: light;
      --night: #07141d;
      --lime: #b6f36a;
      --paper: #f4f5f0;
      --ink: #17252b;
      --muted: #657176;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); line-height: 1.55; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid #8cac58; outline-offset: 4px; }
    .wrap { width: min(980px, calc(100% - 64px)); margin-inline: auto; }
    .site-header { color: #fff; background: var(--night); }
    .nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font-size: 1.05rem; font-weight: 900; letter-spacing: .08em; }
    .back-link { color: var(--lime); font-size: .88rem; font-weight: 800; }
    main { padding-block: 68px 92px; }
    .article-tag { display: inline-block; margin: 0 0 20px; padding: 7px 10px; color: #285b3c; background: #e5edda; font-size: .7rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 850px; margin: 0; font-family: var(--serif); font-size: clamp(2.5rem, 6vw, 4.8rem); line-height: 1.02; letter-spacing: -.035em; }
    .article-excerpt { max-width: 760px; margin: 24px 0; color: #58656a; font-size: clamp(1.05rem, 2vw, 1.25rem); line-height: 1.7; }
    .article-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--muted); font-size: .82rem; font-weight: 700; }
    .article-meta-separator { color: #a6afaa; }
    .article-image { width: 100%; aspect-ratio: 16 / 9; margin: 38px 0 48px; object-fit: cover; background: #dce2df; }
    .article-body { max-width: 720px; margin-inline: auto; font-family: var(--serif); font-size: clamp(1.12rem, 2vw, 1.25rem); line-height: 1.9; }
    .article-body p { margin: 0 0 1.5em; white-space: pre-line; }
    .status { margin: 40px auto; padding: 24px; border: 1px dashed #c9cfca; color: var(--muted); text-align: center; }
    .site-footer { padding-block: 30px; color: #d3dddc; background: var(--night); font-size: .85rem; }
    @media (max-width: 600px) {
      .wrap { width: min(100% - 32px, 980px); }
      main { padding-block: 48px 64px; }
      .article-image { margin-block: 28px 36px; }
      .article-body { font-size: 1.08rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html">SPORTS</a>
      <a class="back-link" href="index.html#noticias">← Volver a noticias</a>
    </div>
  </header>
  <main class="wrap">
    <p class="status" id="article-status" role="status">Cargando artículo…</p>
    <article id="article-content" hidden>
      <p class="article-tag" id="article-tag"></p>
      <h1 id="article-title"></h1>
      <p class="article-excerpt" id="article-excerpt"></p>
      <div class="article-meta">
        <time id="article-date"></time>
        <span class="article-meta-separator" aria-hidden="true">·</span>
        <span id="article-reading-time"></span>
      </div>
      <img class="article-image" id="article-image" alt="">
      <div class="article-body" id="article-body"></div>
    </article>
  </main>
  <footer class="site-footer">
    <div class="wrap">© 2026 SPORTS. Todos los derechos reservados.</div>
  </footer>
  <script>
    const status = document.querySelector("#article-status");
    const articleContent = document.querySelector("#article-content");
    const validCategories = ["futbol", "baloncesto", "motor", "tenis"];
    const categoryLabels = { futbol: "Fútbol", baloncesto: "Baloncesto", motor: "Motor", tenis: "Tenis" };

    function isValidArticle(article) {
      return article &&
        typeof article.slug === "string" &&
        validCategories.includes(article.category) &&
        ["competition", "title", "excerpt", "image_alt", "body"].every((field) => typeof article[field] === "string" && article[field].trim()) &&
        typeof article.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(article.date) &&
        !Number.isNaN(Date.parse(`${article.date}T00:00:00Z`)) &&
        new Date(`${article.date}T00:00:00Z`).toISOString().slice(0, 10) === article.date &&
        typeof article.image === "string" && article.image.trim();
    }

    async function loadArticle() {
      try {
        const slug = new URLSearchParams(window.location.search).get("slug");
        if (!slug) throw new Error("No se ha indicado qué artículo quieres leer.");

        const response = await fetch("content/articles.json");
        if (!response.ok) throw new Error(`No se pudo cargar el archivo de artículos (HTTP ${response.status}).`);

        const data = await response.json();
        if (!data || !Array.isArray(data.articles) || !data.articles.every(isValidArticle)) {
          throw new Error("El archivo de artículos no tiene el formato esperado.");
        }

        const article = data.articles.find((item) => item.slug === slug);
        if (!article) throw new Error("Este artículo no existe o ya no está publicado.");

        const imageUrl = new URL(article.image, window.location.href);
        if (!["http:", "https:"].includes(imageUrl.protocol)) throw new Error("La imagen del artículo tiene una dirección no válida.");

        document.querySelector("#article-tag").textContent = `${categoryLabels[article.category]} / ${article.competition}`;
        document.querySelector("#article-title").textContent = article.title;
        document.querySelector("#article-excerpt").textContent = article.excerpt;
        const date = document.querySelector("#article-date");
        date.dateTime = article.date;
        date.textContent = new Intl.DateTimeFormat("es-ES", { dateStyle: "long", timeZone: "UTC" }).format(new Date(`${article.date}T00:00:00Z`));
        const wordCount = article.body.trim().split(/\s+/).length;
        document.querySelector("#article-reading-time").textContent = `${Math.max(1, Math.ceil(wordCount / 200))} min de lectura`;
        const image = document.querySelector("#article-image");
        image.src = imageUrl.href;
        image.alt = article.image_alt;

        const body = document.querySelector("#article-body");
        const paragraphs = article.body.split(/\n\s*\n/).map((paragraph) => paragraph.trim()).filter(Boolean);
        paragraphs.forEach((paragraph) => {
          const element = document.createElement("p");
          element.textContent = paragraph;
          body.append(element);
        });

        document.title = `${article.title} | SPORTS`;
        document.querySelector('meta[name="description"]').content = article.excerpt;
        status.hidden = true;
        articleContent.hidden = false;
      } catch (error) {
        status.textContent = `No se ha podido cargar el artículo. ${error.message}`;
      }
    }

    loadArticle();
  </script>
</body>
</html>
